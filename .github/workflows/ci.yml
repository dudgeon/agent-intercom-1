name: CI

# Tiers 1 (unit) + 2 (local e2e) per functional area (ADR 0009). No cloud creds needed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mcp: ${{ steps.filter.outputs.mcp }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'agent/**'
              - 'mcp-servers/**'   # agent's local e2e bundles the Timer capability
            mcp:
              - 'mcp-servers/**'
            client:
              - 'apps/**'

  # agent/ — unit (harness) + Tier-2 local e2e against real wrangler dev (workerd + DO + alarms)
  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Timer MCP deps (bundled by the backend e2e)
        run: cd mcp-servers/timer && npm ci
      - name: Install backend deps
        run: cd agent && npm ci
      - name: Typecheck (wrangler dry-run bundle)
        run: cd agent && npm run typecheck
      - name: Unit tests
        run: cd agent && npm run test:unit
      - name: Local e2e (wrangler dev + Durable Objects + alarms)
        run: cd agent && npm run verify

  # mcp-servers/ — unit + MCP-protocol e2e (in-memory client)
  mcp:
    needs: changes
    if: ${{ needs.changes.outputs.mcp == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd mcp-servers/timer && npm ci && npm test

  # apps/ — placeholder until the host is scaffolded (Q4). Client unit + simulated e2e land here.
  client:
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "apps/ host not yet scaffolded (Q4); client unit + simulated-e2e will run here."
